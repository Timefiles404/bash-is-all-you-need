<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="s-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="s-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="760" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">摘要调用看得到什么，看不到什么</text>
  <text x="736" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 05 · 第 3 部分</text>

  <text x="24" y="66" font-size="11.5" fill="#57606a">压缩前的 msgs，一格一条消息：</text>

  <rect x="24" y="76" width="330" height="36" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="189" y="99" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">msgs[:cut] —— 要被扔掉的 11 条</text>
  <g stroke="#93c5fd" stroke-width="1">
    <path d="M54 76 L54 112"/><path d="M84 76 L84 112"/><path d="M114 76 L114 112"/>
    <path d="M144 76 L144 112"/><path d="M174 76 L174 112"/><path d="M204 76 L204 112"/>
    <path d="M234 76 L234 112"/><path d="M264 76 L264 112"/><path d="M294 76 L294 112"/>
    <path d="M324 76 L324 112"/>
  </g>

  <rect x="364" y="76" width="150" height="36" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="439" y="99" font-size="12.5" fill="#1f2328" text-anchor="middle">msgs[cut:] 原样保留</text>
  <g stroke="#d0d7de" stroke-width="1">
    <path d="M401 76 L401 112"/><path d="M439 76 L439 112"/><path d="M477 76 L477 112"/>
  </g>

  <path d="M359 62 L359 126" stroke="#b91c1c" stroke-width="2"/>
  <text x="359" y="58" font-size="11.5" fill="#b91c1c" text-anchor="middle">cut</text>

  <text x="526" y="92" font-size="11.5" fill="#b91c1c">摘要看不到这一边，</text>
  <text x="526" y="107" font-size="11.5" fill="#b91c1c">而它会以为自己看到了全部</text>

  <path d="M189 112 L189 146" stroke="#2563eb" stroke-width="1.5" marker-end="url(#s-b)"/>

  <rect x="24" y="148" width="330" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="189" y="170" font-size="12.5" fill="#1f2328" text-anchor="middle">flatten：摊平成一份文档，不是消息数组</text>
  <path d="M189 182 L189 204" stroke="#57606a" stroke-width="1.5" marker-end="url(#s-a)"/>

  <rect x="24" y="206" width="330" height="104" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="36" y="226" font-size="11" fill="#57606a" font-family="ui-monospace, Consolas, monospace">[user]</text>
  <text x="36" y="242" font-size="11" fill="#57606a" font-family="ui-monospace, Consolas, monospace">这个仓库有多大？</text>
  <text x="36" y="258" font-size="11" fill="#57606a" font-family="ui-monospace, Consolas, monospace">[assistant ran] wc -l *_test.go</text>
  <text x="36" y="274" font-size="11" fill="#57606a" font-family="ui-monospace, Consolas, monospace">[output]</text>
  <text x="36" y="290" font-size="11" fill="#57606a" font-family="ui-monospace, Consolas, monospace">  3120 total … [中间截掉] … [exit 0]</text>
  <text x="36" y="304" font-size="10.5" fill="#b91c1c">命令而不是 JSON 参数；长输出从中间截；tool_call_id 一个都不出现</text>
  <path d="M189 310 L189 332" stroke="#57606a" stroke-width="1.5" marker-end="url(#s-a)"/>

  <rect x="24" y="334" width="330" height="58" rx="5" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="189" y="354" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="600">一次真实的模型调用</text>
  <text x="189" y="372" font-size="11" fill="#92400e" text-anchor="middle">system = summarySystem</text>
  <text x="189" y="386" font-size="11" fill="#92400e" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">tools = nil  ← 调不了工具，不是「不建议」</text>
  <path d="M354 363 L392 363" stroke="#57606a" stroke-width="1.5" marker-end="url(#s-a)"/>

  <rect x="396" y="334" width="150" height="58" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="471" y="357" font-size="12" fill="#1f2328" text-anchor="middle">摘要正文</text>
  <text x="471" y="375" font-size="11" fill="#57606a" text-anchor="middle">GOAL / FACTS /</text>
  <text x="471" y="388" font-size="11" fill="#57606a" text-anchor="middle">DECISIONS / STATE</text>

  <path d="M471 392 L471 414" stroke="#57606a" stroke-width="1.5" marker-end="url(#s-a)"/>

  <text x="24" y="424" font-size="11.5" fill="#57606a">压缩后的 msgs：</text>

  <rect x="24" y="432" width="200" height="36" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="124" y="448" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">一条 user 消息</text>
  <text x="124" y="463" font-size="11" fill="#1e40af" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">&lt;session-summary&gt;…</text>

  <rect x="234" y="432" width="150" height="36" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="309" y="455" font-size="12" fill="#1f2328" text-anchor="middle">msgs[cut:] 原样</text>

  <text x="400" y="455" font-size="11.5" fill="#b91c1c">摘要占 user 的位子，所以右边第一条必须是 assistant</text>

  <text x="24" y="496" font-size="11.5" fill="#57606a">摊平做了三件事：任务从「接着聊」变成「读材料」；长输出在付钱之前就截短；工具定义为空，调用成为不可能。</text>
  <text x="24" y="514" font-size="11.5" fill="#b91c1c">而那条竖线右边的内容它永远看不到 —— 所以系统提示里必须写明这件事，否则它会替整个会话下断言。</text>
</svg>
