<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="800" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="800" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">同一个任务，两次真实运行的 read 列</text>
  <text x="776" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 04</text>

  <text x="24" y="68" font-size="12.5" fill="#57606a">读一个 56KB 的文件再动手改，一路 in / write / read 都是 agent 自己打出来的仪表行。</text>

  <path d="M400 86 L400 400" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- explicit -->
  <rect x="24" y="90" width="358" height="28" rx="5" fill="#f0fdf4" stroke="#15803d"/>
  <text x="203" y="109" font-size="12.5" fill="#14532d" text-anchor="middle">带 cache_control：read 只增不减</text>

  <text x="34" y="140" font-size="11" fill="#57606a" font-family="ui-monospace, Consolas, monospace">in 10348   write 10342   read 0</text>
  <text x="34" y="168" font-size="11" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">in 10484   write 136     read 10342</text>
  <text x="34" y="196" font-size="11" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">in 10655   write 171     read 10478</text>
  <text x="34" y="224" font-size="11" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">in 10805   write 150     read 10649</text>
  <text x="34" y="252" font-size="11" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">in 11114   write 309     read 10799</text>
  <text x="34" y="280" font-size="11" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">in 11276   write 162     read 11108</text>

  <path d="M300 144 L344 144 L344 160 L296 160" stroke="#15803d" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>
  <path d="M300 172 L354 172 L354 188 L296 188" stroke="#15803d" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>
  <path d="M300 200 L354 200 L354 216 L296 216" stroke="#15803d" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>
  <path d="M300 228 L354 228 L354 244 L296 244" stroke="#15803d" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>
  <path d="M300 256 L354 256 L354 272 L296 272" stroke="#15803d" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>

  <rect x="24" y="298" width="358" height="72" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text x="40" y="320" font-size="12" fill="#14532d">这一轮的 write 加上这一轮的 read，</text>
  <text x="40" y="340" font-size="12" fill="#14532d">正好是下一轮的 read：136 + 10342 = 10478。</text>
  <text x="40" y="360" font-size="11.5" fill="#15803d">记号钉的是精确的前缀，所以一个字节都不浪费。</text>

  <!-- implicit -->
  <rect x="418" y="90" width="358" height="28" rx="5" fill="#fff7ed" stroke="#d97706"/>
  <text x="597" y="109" font-size="12.5" fill="#92400e" text-anchor="middle">不带记号：read 会往下掉</text>

  <text x="428" y="140" font-size="11" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">in 10348   full 1900   read 8448</text>
  <text x="686" y="140" font-size="10.5" fill="#92400e" font-family="ui-monospace, Consolas, monospace">132×64</text>
  <text x="428" y="168" font-size="11" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">in 10793   full 2089   read 8704</text>
  <text x="686" y="168" font-size="10.5" fill="#92400e" font-family="ui-monospace, Consolas, monospace">136×64</text>
  <text x="428" y="196" font-size="11" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">in 11018   full 2570   read 8448</text>
  <text x="686" y="196" font-size="10.5" fill="#92400e" font-family="ui-monospace, Consolas, monospace">132×64</text>
  <text x="428" y="224" font-size="11" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">in 11570   full 2866   read 8704</text>
  <text x="686" y="224" font-size="10.5" fill="#92400e" font-family="ui-monospace, Consolas, monospace">136×64</text>
  <text x="428" y="252" font-size="11" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">in 11671   full 791    read 10880</text>
  <text x="686" y="252" font-size="10.5" fill="#92400e" font-family="ui-monospace, Consolas, monospace">170×64</text>

  <path d="M666 146 L666 162" stroke="#d97706" stroke-width="1.3" marker-end="url(#aw)"/>
  <path d="M666 174 L666 190" stroke="#d97706" stroke-width="1.3" marker-end="url(#aw)"/>
  <path d="M666 202 L666 218" stroke="#d97706" stroke-width="1.3" marker-end="url(#aw)"/>
  <path d="M666 230 L666 246" stroke="#d97706" stroke-width="1.3" marker-end="url(#aw)"/>

  <rect x="418" y="298" width="358" height="72" rx="6" fill="#fff7ed" stroke="#d97706"/>
  <text x="434" y="320" font-size="12" fill="#92400e">对话只会变长，read 却上上下下。</text>
  <text x="434" y="340" font-size="12" fill="#92400e">每一个数都是 64 的整数倍。</text>
  <text x="434" y="360" font-size="11.5" fill="#92400e">隐式缓存按 64 token 一块对齐，每次请求重新决定命中到哪。</text>

  <!-- bottom -->
  <rect x="24" y="392" width="752" height="106" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="42" y="416" font-size="13" fill="#1e3a8a" font-weight="600">而这一章最该记住的一行，在右边</text>
  <text x="42" y="440" font-size="12" fill="#1e40af">这场实验里，右边那一列（一个记号都不放）总账反而更便宜：约 15,300 对 20,000 等价 token。</text>
  <text x="42" y="460" font-size="12" fill="#1e40af">滚动记号每一轮都要写一次新条目，而第一次写的是整整一万个 token 的前缀，按 1.25 倍算。</text>
  <text x="42" y="480" font-size="12" fill="#1e40af">六次调用的会话，读回来的次数还不够把这笔写入摊平。显式记号买到的不是更便宜，是可预测。</text>
</svg>
