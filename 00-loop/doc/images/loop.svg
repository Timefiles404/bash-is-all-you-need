<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 545" width="700" height="545"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="700" height="545" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="700" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="700" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">What happens in one turn</text>
  <text x="676" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 00</text>

  <!-- spine -->
  <rect x="250" y="64" width="200" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="86" font-size="13" fill="#1f2328" text-anchor="middle">You type one sentence</text>
  <path d="M350 98 L350 116" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="195" y="118" width="310" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="140" font-size="13" fill="#1f2328" text-anchor="middle">append it to messages as a user message</text>
  <path d="M350 152 L350 172" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="135" y="174" width="430" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="196" font-size="13.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">POST /chat/completions</text>
  <text x="350" y="216" font-size="12.5" fill="#1e40af" text-anchor="middle">the entire messages array, plus the bash tool definition</text>
  <path d="M350 232 L350 252" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="175" y="254" width="350" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="276" font-size="13" fill="#1f2328" text-anchor="middle">append the model's reply to messages, verbatim</text>
  <path d="M350 288 L350 306" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="215" y="308" width="270" height="40" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="333" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">does this reply carry tool_calls?</text>

  <!-- no branch -->
  <path d="M485 328 L560 328 L560 384" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <text x="566" y="324" font-size="12" fill="#15803d">no</text>
  <rect x="440" y="386" width="240" height="34" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text x="560" y="408" font-size="13" fill="#14532d" text-anchor="middle">print the text, the turn ends</text>

  <!-- yes branch -->
  <path d="M215 328 L150 328 L150 384" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <text x="122" y="324" font-size="12" fill="#2563eb">yes</text>
  <rect x="35" y="386" width="230" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="150" y="408" font-size="13" fill="#1f2328" text-anchor="middle">run every bash command in it</text>
  <path d="M150 420 L150 438" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="35" y="440" width="230" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="150" y="461" font-size="13" fill="#1f2328" text-anchor="middle">each output is appended as</text>
  <text x="150" y="479" font-size="12" fill="#57606a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">{role:"tool", tool_call_id}</text>

  <!-- loop back -->
  <path d="M35 466 L18 466 L18 203 L131 203" stroke="#2563eb" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" marker-end="url(#ab)"/>
  <text x="30" y="330" font-size="12" fill="#2563eb" transform="rotate(-90 30 330)" text-anchor="middle">send it again, now carrying the results</text>

  <text x="24" y="527" font-size="11.5" fill="#57606a">The dashed line is the loop: while the model keeps asking for tools, it goes round again.</text>
</svg>
