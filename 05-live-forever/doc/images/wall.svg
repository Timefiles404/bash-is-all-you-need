<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="760" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">The context curve of one session</text>
  <text x="736" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 05</text>

  <!-- axes -->
  <path d="M92 340 L732 340" stroke="#57606a" stroke-width="1.2" marker-end="url(#w-a)"/>
  <path d="M92 340 L92 74" stroke="#57606a" stroke-width="1.2" marker-end="url(#w-a)"/>
  <text x="726" y="358" font-size="11.5" fill="#57606a" text-anchor="end">turn after turn after turn →</text>
  <text x="20" y="210" font-size="11.5" fill="#57606a" transform="rotate(-90 20 210)" text-anchor="middle">how big this request is</text>

  <!-- reference lines -->
  <path d="M92 92 L732 92" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="100" y="86" font-size="11.5" fill="#b91c1c">the context window. Cross it and the request is refused whole</text>

  <path d="M92 150 L732 150" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="100" y="144" font-size="11" fill="#92400e">threshold × window — act here</text>

  <path d="M92 256 L732 256" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="100" y="272" font-size="11" fill="#57606a">keepRatio × window — where it lands afterwards</text>

  <!-- arm: no compaction -->
  <path d="M100 336 L392 92" stroke="#6b7280" stroke-width="2" fill="none"/>
  <path d="M384 84 L400 100 M400 84 L384 100" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="410" y="82" font-size="12" fill="#b91c1c" font-weight="600">the session ends here</text>
  <text x="410" y="99" font-size="11" fill="#6b7280">retrying does not help; it is the same array</text>
  <text x="180" y="300" font-size="11.5" fill="#6b7280" transform="rotate(-40 180 300)">no compaction</text>

  <!-- arm: with compaction -->
  <path d="M100 336 L236 150 L236 256 L400 150 L400 256 L564 150 L564 256 L716 176"
        stroke="#2563eb" stroke-width="2.2" fill="none"/>
  <text x="600" y="230" font-size="11.5" fill="#2563eb" font-weight="600">compaction</text>

  <!-- the price of each drop -->
  <g font-size="10.5" fill="#b91c1c">
    <path d="M236 256 L236 300" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M400 256 L400 300" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M564 256 L564 300" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="236" cy="304" r="3.5" fill="#b91c1c"/>
    <circle cx="400" cy="304" r="3.5" fill="#b91c1c"/>
    <circle cx="564" cy="304" r="3.5" fill="#b91c1c"/>
  </g>
  <text x="400" y="326" font-size="11" fill="#b91c1c" text-anchor="middle">Each red dot: one summarising call + a rewritten prefix + a full-price re-read</text>

  <text x="24" y="382" font-size="11.5" fill="#57606a">The left line stops at the wall. The right one goes on, paying a cache write-off at each drop.</text>
  <text x="24" y="402" font-size="11.5" fill="#57606a">This chapter's measurement: in a session that never hit the wall, that trade loses — see Measured.</text>
</svg>
