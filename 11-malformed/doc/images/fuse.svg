<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="760" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">Every step correct, and then sixteen laps</text>
  <text x="736" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 11</text>

  <!-- cycle -->
  <rect x="256" y="66" width="248" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="92" font-size="12.5" fill="#1f2328" text-anchor="middle">the model writes a command</text>

  <rect x="524" y="166" width="216" height="42" rx="6" fill="#fff7ed" stroke="#d97706"/>
  <text x="632" y="192" font-size="12.5" fill="#92400e" text-anchor="middle">max_tokens cuts mid-argument</text>

  <rect x="256" y="266" width="248" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="292" font-size="12.5" fill="#1f2328" text-anchor="middle">the result says: the call was cut</text>

  <rect x="20" y="166" width="216" height="42" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text x="128" y="186" font-size="12.5" fill="#14532d" text-anchor="middle">the boundary calls it cut</text>
  <text x="128" y="202" font-size="11.5" fill="#14532d" text-anchor="middle">classified right, nothing run</text>

  <path d="M504 92 L620 92 L630 160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <path d="M632 208 L632 292 L510 292" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <path d="M256 292 L128 292 L128 214" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <path d="M128 166 L128 92 L250 92" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>

  <!-- centre -->
  <rect x="272" y="142" width="216" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="166" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">it cannot see max_tokens</text>
  <text x="380" y="190" font-size="12" fill="#1e40af" text-anchor="middle">the diagnosis names a cause</text>
  <text x="380" y="207" font-size="12" fill="#1e40af" text-anchor="middle">it cannot act on, so the only</text>
  <text x="380" y="224" font-size="12" fill="#1e40af" text-anchor="middle">move is to rewrite the same</text>

  <!-- two outcomes -->
  <rect x="30" y="336" width="330" height="112" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="48" y="358" font-size="12.5" fill="#1f2328" font-weight="600">no fuse (--max-tokens 110, measured)</text>
  <text x="48" y="384" font-size="13" fill="#b91c1c" font-family="ui-monospace, Consolas, monospace">16 model calls · 0 commands · 16 faultCut</text>
  <text x="48" y="410" font-size="12" fill="#57606a">each one classified, refused, recorded correctly</text>
  <text x="48" y="430" font-size="12" fill="#57606a">the only thing that stopped it was the turn budget</text>

  <rect x="400" y="336" width="330" height="112" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="418" y="358" font-size="12.5" fill="#14532d" font-weight="600">with a fuse: three all-truncated turns, stop</text>
  <text x="418" y="384" font-size="13" fill="#14532d" font-family="ui-monospace, Consolas, monospace">3 calls · 0 commands · 3 malformed</text>
  <text x="418" y="410" font-size="12" fill="#57606a">now addressed to the human, naming the knob:</text>
  <text x="418" y="430" font-size="12" fill="#57606a">raise --max-tokens (currently 110)</text>

  <text x="24" y="466" font-size="11.5" fill="#57606a">Three rather than two: two in a row can be bad luck, three is a pattern.</text>
  <text x="24" y="484" font-size="11.5" fill="#57606a">A fuse is not a fix. It is a ceiling on a loop you already know you cannot fix.</text>
</svg>
