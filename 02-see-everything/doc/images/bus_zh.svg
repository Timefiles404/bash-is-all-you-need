<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="700" height="480" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="700" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="700" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">从一次打印，变成一条事件</text>
  <text x="676" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 02</text>

  <!-- before -->
  <text x="24" y="66" font-size="11.5" fill="#6b7280">阶段 00 / 01</text>

  <rect x="24" y="76" width="160" height="42" rx="6" fill="#f3f4f6" stroke="#d0d7de"/>
  <text x="104" y="94" font-size="13" fill="#4b5563" text-anchor="middle">agent 循环</text>
  <text x="104" y="111" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">fmt.Printf(…)</text>

  <path d="M184 97 L236 97" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="238" y="76" width="130" height="42" rx="6" fill="#f3f4f6" stroke="#d0d7de"/>
  <text x="303" y="102" font-size="13" fill="#4b5563" text-anchor="middle">终端</text>

  <text x="396" y="92" font-size="11.5" fill="#6b7280">屏幕就是唯一的一份记录，</text>
  <text x="396" y="110" font-size="11.5" fill="#6b7280">而它会滚。</text>

  <line x1="24" y1="136" x2="676" y2="136" stroke="#e5e7eb" stroke-width="1"/>

  <!-- after -->
  <text x="24" y="160" font-size="11.5" fill="#6b7280">阶段 02</text>

  <rect x="24" y="238" width="150" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="99" y="262" font-size="13" fill="#1f2328" text-anchor="middle">agent 循环</text>
  <text x="99" y="281" font-size="11" fill="#57606a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">bus.Emit(Event{…})</text>

  <path d="M174 266 L214 266" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- the bus -->
  <rect x="216" y="172" width="130" height="188" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="281" y="196" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">Bus</text>
  <text x="281" y="222" font-size="11.5" fill="#1e40af" text-anchor="middle">盖上 seq 和时间戳</text>
  <text x="281" y="246" font-size="11.5" fill="#1e40af" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">1 2 3 4 5 …</text>
  <line x1="236" y1="266" x2="326" y2="266" stroke="#bfdbfe" stroke-width="1"/>
  <text x="281" y="290" font-size="11.5" fill="#1e40af" text-anchor="middle">同步分发，在锁里</text>
  <text x="281" y="312" font-size="11.5" fill="#1e40af" text-anchor="middle">所以只有一个</text>
  <text x="281" y="332" font-size="11.5" fill="#1e40af" text-anchor="middle" font-weight="600">总顺序</text>

  <!-- subscribers -->
  <path d="M346 202 L406 202" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <path d="M346 266 L406 266" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="408" y="176" width="176" height="52" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="496" y="197" font-size="13" fill="#1e3a8a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">renderer</text>
  <text x="496" y="216" font-size="11.5" fill="#1e40af" text-anchor="middle">终端上的字和仪表盘</text>

  <rect x="408" y="240" width="176" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="496" y="261" font-size="13" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">TraceWriter</text>
  <text x="496" y="280" font-size="11.5" fill="#57606a" text-anchor="middle">每行一条事件的文件</text>

  <rect x="408" y="330" width="176" height="44" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text x="496" y="348" font-size="13" fill="#14532d" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">Replay</text>
  <text x="496" y="366" font-size="11.5" fill="#14532d" text-anchor="middle">把那个文件读回来</text>

  <!-- file down into replay, then back up into the same renderer -->
  <path d="M496 292 L496 326" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M584 352 L622 352 L622 202 L588 202" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <text x="636" y="270" font-size="11.5" fill="#15803d" transform="rotate(-90 636 270)" text-anchor="middle">同一个 renderer，不用网络，不用 key</text>

  <text x="24" y="404" font-size="11.5" fill="#57606a">agent 循环不知道右边有几个盒子，</text>
  <text x="24" y="422" font-size="11.5" fill="#57606a">也不知道有没有。</text>

  <text x="24" y="458" font-size="11.5" fill="#57606a">加一样能看的东西，是加一个订阅者；不是在循环里加一行打印。</text>
</svg>
