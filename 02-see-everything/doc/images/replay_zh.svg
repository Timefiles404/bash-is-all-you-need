<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 486" width="700" height="486"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="700" height="486" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="700" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="700" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">同一个 renderer，两条路进去</text>
  <text x="676" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 02</text>

  <!-- live lane -->
  <text x="26" y="70" font-size="12" fill="#2563eb" font-weight="600">这一次，正在跑</text>
  <rect x="26" y="80" width="150" height="34" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="101" y="102" font-size="12" fill="#1e3a8a" text-anchor="middle">agent 的循环</text>
  <path d="M176 97 L214 97" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect x="216" y="80" width="120" height="34" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="276" y="102" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">Bus</text>

  <!-- two subscribers -->
  <path d="M336 90 L410 90" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <path d="M336 104 L410 150" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="412" y="74" width="180" height="32" rx="5" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="502" y="95" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">renderer</text>
  <path d="M592 90 L638 90" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="666" y="94" font-size="11.5" fill="#57606a" text-anchor="end">屏幕</text>

  <rect x="412" y="136" width="180" height="32" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="502" y="157" font-size="12.5" fill="#14532d" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">trace writer</text>

  <!-- the file -->
  <path d="M502 168 L502 196" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="330" y="198" width="344" height="72" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="346" y="218" font-size="12" fill="#14532d" font-family="ui-monospace, Consolas, monospace">session.jsonl</text>
  <text x="346" y="238" font-size="11.5" fill="#14532d" font-family="ui-monospace, Consolas, monospace">{"seq":1,"kind":"provider",...}</text>
  <text x="346" y="254" font-size="11.5" fill="#14532d" font-family="ui-monospace, Consolas, monospace">{"seq":2,"kind":"request",...}</text>
  <text x="620" y="238" font-size="11" fill="#15803d" text-anchor="end">一行一个对象</text>
  <text x="620" y="254" font-size="11" fill="#15803d" text-anchor="end">写完就落盘</text>

  <!-- replay lane -->
  <text x="26" y="230" font-size="12" fill="#57606a" font-weight="600">下一次，或者别人的那一次</text>
  <rect x="26" y="240" width="150" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="101" y="262" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">replay</text>
  <path d="M176 257 L322 235" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="230" y="278" font-size="11" fill="#57606a" text-anchor="middle">逐行读回来</text>

  <path d="M330 250 L200 250" stroke="#57606a" stroke-width="0" fill="none"/>
  <path d="M176 274 L120 274 L120 316 L400 316 L400 178 L406 178" stroke="#57606a" stroke-width="1.5"
        fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="260" y="334" font-size="11.5" fill="#57606a">喂给同一个 renderer，没有第二份显示代码</text>


  <!-- the torn last line -->
  <text x="26" y="360" font-size="12" fill="#57606a" font-weight="600">进程被 kill 的时候，最后一行只写了一半：</text>
  <rect x="26" y="370" width="420" height="26" rx="4" fill="#fef2f2" stroke="#cf222e"/>
  <text x="42" y="388" font-size="11.5" fill="#cf222e" font-family="ui-monospace, Consolas, monospace">{"seq":41,"kind":"comm</text>
  <text x="300" y="388" font-size="11" fill="#cf222e">没有结尾的换行</text>

  <path d="M456 383 L500 383" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="502" y="368" width="172" height="30" rx="4" fill="#f0fdf4" stroke="#15803d"/>
  <text x="588" y="387" font-size="11.5" fill="#14532d" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">半行 + io.EOF</text>

  <rect x="26" y="406" width="648" height="46" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="42" y="425" font-size="11.5" fill="#14532d">写入者是「对象 + 换行」一次写出去的，所以这对组合正好是「它写到一半死了」的信号。不返回 error：</text>
  <text x="42" y="443" font-size="11.5" fill="#14532d" font-family="ui-monospace, Consolas, monospace">[trace] 这个文件以一个不完整的行结尾 · 读回 41 条事件</text>

  <text x="26" y="474" font-size="11.5" fill="#57606a">损坏作为一条事件接在末尾，因为最后半行的那次会话，恰恰是你最想打开的那一次。</text>
</svg>
