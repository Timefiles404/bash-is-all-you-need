<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="e-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="e-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="e-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="700" height="520" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="700" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="700" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">How that ratio gets calibrated</text>
  <text x="676" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 05 · part 2</text>

  <rect x="150" y="64" width="400" height="46" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="84" font-size="13" fill="#1f2328" text-anchor="middle">everything about to be sent</text>
  <text x="350" y="102" font-size="11.5" fill="#57606a" text-anchor="middle">history + system prompt + tool definitions</text>
  <path d="M350 110 L350 130" stroke="#57606a" stroke-width="1.5" marker-end="url(#e-a)"/>

  <rect x="150" y="132" width="400" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="152" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="600">before sending, count the characters</text>
  <text x="350" y="170" font-size="11.5" fill="#1e40af" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">sentChars = convChars(msgs) + base</text>
  <path d="M350 178 L350 198" stroke="#57606a" stroke-width="1.5" marker-end="url(#e-a)"/>

  <rect x="215" y="200" width="270" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="222" font-size="13" fill="#1f2328" text-anchor="middle">POST, then wait for the response</text>
  <path d="M350 234 L350 254" stroke="#57606a" stroke-width="1.5" marker-end="url(#e-a)"/>

  <rect x="150" y="256" width="400" height="46" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="350" y="276" font-size="13" fill="#14532d" text-anchor="middle" font-weight="600">afterwards the server hands you the true number</text>
  <text x="350" y="294" font-size="11.5" fill="#14532d" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">usage.prompt = 2842</text>
  <path d="M350 302 L350 322" stroke="#57606a" stroke-width="1.5" marker-end="url(#e-a)"/>

  <rect x="120" y="324" width="460" height="62" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="345" font-size="13" fill="#1f2328" text-anchor="middle">one call, one pair of numbers, fed to the estimator</text>
  <text x="350" y="365" font-size="11.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">r = sentChars / 2842</text>
  <text x="350" y="381" font-size="11.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">ratio = 0.75*ratio + 0.25*r</text>
  <path d="M350 386 L350 402" stroke="#57606a" stroke-width="1.5" marker-end="url(#e-a)"/>

  <rect x="230" y="404" width="240" height="38" rx="19" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="350" y="428" font-size="13.5" fill="#92400e" text-anchor="middle" font-weight="600">ratio ≈ 3.7 characters / token</text>

  <path d="M580 355 L640 355 L640 87 L554 87" stroke="#2563eb" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" marker-end="url(#e-b)"/>
  <text x="658" y="230" font-size="11.5" fill="#2563eb" transform="rotate(-90 658 230)" text-anchor="middle">used to estimate before the next turn</text>

  <rect x="30" y="404" width="190" height="38" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="125" y="421" font-size="12" fill="#92400e" text-anchor="middle">chars / ratio ≥</text>
  <text x="125" y="436" font-size="12" fill="#92400e" text-anchor="middle">threshold × window ?</text>
  <path d="M228 423 L221 423" stroke="#d97706" stroke-width="1.5" marker-end="url(#e-g)"/>

  <text x="24" y="472" font-size="11.5" fill="#57606a">The point is consistency, not accuracy: it calibrates on convChars + base and converts convChars + base.</text>
  <text x="24" y="492" font-size="11.5" fill="#57606a">Fixed overheads — system prompt, tool schemas, JSON envelope — are absorbed into the ratio, not summed.</text>
  <text x="24" y="512" font-size="11.5" fill="#b91c1c">One thing breaks it: measure one thing, estimate another. So thinking blocks count on neither side.</text>
</svg>
