<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="760" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">每一步都做对了，然后转了十六圈</text>
  <text x="736" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 11</text>

  <!-- cycle -->
  <rect x="256" y="66" width="248" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="92" font-size="12.5" fill="#1f2328" text-anchor="middle">模型写一条命令</text>

  <rect x="524" y="166" width="216" height="42" rx="6" fill="#fff7ed" stroke="#d97706"/>
  <text x="632" y="192" font-size="12.5" fill="#92400e" text-anchor="middle">max_tokens 砍在参数中间</text>

  <rect x="256" y="266" width="248" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="292" font-size="12.5" fill="#1f2328" text-anchor="middle">结果里如实写：这次调用没写完</text>

  <rect x="20" y="166" width="216" height="42" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text x="128" y="186" font-size="12.5" fill="#14532d" text-anchor="middle">边界判成 cut</text>
  <text x="128" y="202" font-size="11.5" fill="#14532d" text-anchor="middle">分类正确，什么都不执行</text>

  <path d="M504 92 L620 92 L630 160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <path d="M632 208 L632 292 L510 292" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <path d="M256 292 L128 292 L128 214" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <path d="M128 166 L128 92 L250 92" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>

  <!-- centre -->
  <rect x="272" y="142" width="216" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="166" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">它看不见 max_tokens</text>
  <text x="380" y="190" font-size="12" fill="#1e40af" text-anchor="middle">诊断点的是一个它没法</text>
  <text x="380" y="207" font-size="12" fill="#1e40af" text-anchor="middle">采取行动的原因，所以唯一</text>
  <text x="380" y="224" font-size="12" fill="#1e40af" text-anchor="middle">的动作是重写一条同样长的</text>

  <!-- two outcomes -->
  <rect x="30" y="336" width="330" height="112" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="48" y="358" font-size="12.5" fill="#1f2328" font-weight="600">没有保险丝（--max-tokens 110，实测）</text>
  <text x="48" y="384" font-size="13" fill="#b91c1c" font-family="ui-monospace, Consolas, monospace">16 model calls · 0 commands · 16 faultCut</text>
  <text x="48" y="410" font-size="12" fill="#57606a">每一次都被正确分类、正确拒绝、正确记录</text>
  <text x="48" y="430" font-size="12" fill="#57606a">停下来的唯一原因是回合预算用完了</text>

  <rect x="400" y="336" width="330" height="112" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="418" y="358" font-size="12.5" fill="#14532d" font-weight="600">加一根保险丝：连续 3 轮全是截断就停</text>
  <text x="418" y="384" font-size="13" fill="#14532d" font-family="ui-monospace, Consolas, monospace">3 calls · 0 commands · 3 malformed</text>
  <text x="418" y="410" font-size="12" fill="#57606a">这句话改成对人说的，并且点名那个旋钮：</text>
  <text x="418" y="430" font-size="12" fill="#57606a">raise --max-tokens (currently 110)</text>

  <text x="24" y="476" font-size="11.5" fill="#57606a">阈值是 3 而不是 2：连着两轮有可能只是模型缩短了命令又运气不好，三轮是一个规律。保险丝不是修复，是给一个已知修不了的循环设一个上限。</text>
  <text x="24" y="494" font-size="11.5" fill="#57606a">一轮里只要有任何一个调用跑通了，计数就归零 —— 否则一次偶发的截断会让一段正常的会话莫名死掉。</text>
</svg>
