<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="780" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="780" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="780" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">Caching is a prefix match</text>
  <text x="756" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 04</text>

  <text x="24" y="68" font-size="12.5" fill="#57606a">The byte order of a request: tools, then system, then messages. A marker only says "up to here".</text>

  <path d="M392 86 L392 424" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- normal -->
  <text x="24" y="106" font-size="12.5" fill="#1f2328" font-weight="600">normal: two markers</text>

  <rect x="32" y="118" width="210" height="28" rx="4" fill="#f0fdf4" stroke="#15803d"/>
  <text x="137" y="137" font-size="12" fill="#14532d" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">tools</text>

  <rect x="32" y="148" width="210" height="28" rx="4" fill="#f0fdf4" stroke="#15803d"/>
  <text x="137" y="167" font-size="12" fill="#14532d" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">system</text>

  <path d="M242 162 L286 162" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="292" y="158" font-size="11.5" fill="#15803d">marker 1</text>
  <text x="292" y="174" font-size="11" fill="#57606a">never moves</text>

  <rect x="32" y="182" width="210" height="24" rx="4" fill="#f0fdf4" stroke="#15803d"/>
  <text x="137" y="199" font-size="11.5" fill="#14532d" text-anchor="middle">turn 1: ask · run · output</text>

  <rect x="32" y="208" width="210" height="24" rx="4" fill="#f0fdf4" stroke="#15803d"/>
  <text x="137" y="225" font-size="11.5" fill="#14532d" text-anchor="middle">turn 2: command · output</text>

  <text x="137" y="248" font-size="12" fill="#57606a" text-anchor="middle">…</text>

  <rect x="32" y="256" width="210" height="24" rx="4" fill="#f0fdf4" stroke="#15803d"/>
  <text x="137" y="273" font-size="11.5" fill="#14532d" text-anchor="middle">turn N-1: command · output</text>

  <rect x="32" y="282" width="210" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="137" y="299" font-size="11.5" fill="#1e3a8a" text-anchor="middle">turn N: what this turn adds</text>

  <path d="M242 294 L286 294" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="292" y="290" font-size="11.5" fill="#15803d">marker 2</text>
  <text x="292" y="306" font-size="11" fill="#57606a">moves each turn</text>

  <text x="32" y="336" font-size="11.5" fill="#15803d">green: byte-identical, billed as a read</text>
  <text x="32" y="356" font-size="11.5" fill="#2563eb">blue: new this turn, billed at full price</text>

  <!-- broken -->
  <text x="404" y="106" font-size="12.5" fill="#1f2328" font-weight="600">--break-cache: one timestamp line at the front</text>

  <rect x="412" y="118" width="210" height="28" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="517" y="137" font-size="11" fill="#92400e" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">Current time: 2026-08-27T…</text>

  <path d="M622 132 L666 132" stroke="#d97706" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="672" y="128" font-size="11.5" fill="#92400e">always new</text>
  <text x="672" y="144" font-size="11" fill="#57606a">just this line</text>

  <rect x="412" y="148" width="210" height="28" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="517" y="167" font-size="12" fill="#57606a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">tools</text>

  <rect x="412" y="178" width="210" height="28" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="517" y="197" font-size="12" fill="#57606a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">system</text>

  <rect x="412" y="208" width="210" height="24" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="517" y="225" font-size="11.5" fill="#57606a" text-anchor="middle">turn 1</text>

  <rect x="412" y="234" width="210" height="24" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="517" y="251" font-size="11.5" fill="#57606a" text-anchor="middle">turn 2</text>

  <text x="517" y="274" font-size="12" fill="#57606a" text-anchor="middle">…</text>

  <rect x="412" y="282" width="210" height="24" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="517" y="299" font-size="11.5" fill="#57606a" text-anchor="middle">turn N</text>

  <path d="M636 160 L636 300" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="648" y="236" font-size="11.5" fill="#92400e">all full price</text>

  <text x="412" y="336" font-size="11.5" fill="#92400e">One byte changed, so no marker after it does anything.</text>
  <text x="412" y="356" font-size="11.5" fill="#57606a">No error, HTTP 200. Only the bill changes.</text>

  <!-- bottom -->
  <rect x="24" y="386" width="732" height="88" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="42" y="410" font-size="12.5" fill="#1e3a8a" font-weight="600">Which gives two rules that matter more than the markers themselves</text>
  <text x="42" y="432" font-size="12" fill="#1e40af">One: a marker only helps if every byte before it is the same on the next request.</text>
  <text x="42" y="452" font-size="12" fill="#1e40af">Two: stable content first, volatile content last — the order matters more than where the markers go.</text>
</svg>
