<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="780" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="780" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">One cache hit, two directions of accounting</text>
  <text x="756" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 03</text>

  <text x="24" y="70" font-size="12.5" fill="#57606a">The same ~9,800-token prompt, sent a second time (structure, not to scale)</text>

  <path d="M390 86 L390 336" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- OpenAI side -->
  <text x="24" y="106" font-size="12.5" fill="#1f2328" font-weight="600">OpenAI: the hit is counted inside the total</text>

  <rect x="32" y="118" width="336" height="76" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="138" font-size="11.5" fill="#1e3a8a" font-family="ui-monospace, Consolas, monospace">prompt_tokens = 9815</text>
  <rect x="48" y="146" width="304" height="36" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="200" y="169" font-size="11.5" fill="#1e40af" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">cached_tokens = 9792</text>

  <path d="M200 194 L200 216" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="212" y="210" font-size="11.5" fill="#2563eb">the adapter subtracts</text>

  <rect x="32" y="218" width="336" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="200" y="238" font-size="11.5" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">Input = 9815 - 9792 = 23</text>
  <text x="200" y="256" font-size="11.5" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">CacheRead = 9792</text>

  <!-- Anthropic side -->
  <text x="404" y="106" font-size="12.5" fill="#1f2328" font-weight="600">Anthropic: the hit sits beside the total</text>

  <rect x="412" y="118" width="112" height="76" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="468" y="152" font-size="11" fill="#1e3a8a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">input_tokens</text>
  <text x="468" y="172" font-size="13" fill="#1e3a8a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">18</text>

  <rect x="534" y="118" width="214" height="76" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="641" y="152" font-size="11" fill="#1e40af" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">cache_read_input_tokens</text>
  <text x="641" y="172" font-size="13" fill="#1e40af" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">9775</text>

  <path d="M580 194 L580 216" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="592" y="210" font-size="11.5" fill="#2563eb">the adapter copies it</text>

  <rect x="412" y="218" width="336" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="580" y="238" font-size="11.5" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">Input = 18</text>
  <text x="580" y="256" font-size="11.5" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">CacheRead = 9775</text>

  <!-- converge -->
  <path d="M200 268 L200 292 L390 292" stroke="#57606a" stroke-width="1.5" fill="none"/>
  <path d="M580 268 L580 292 L392 292" stroke="#57606a" stroke-width="1.5" fill="none"/>
  <path d="M390 292 L390 306" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="196" y="308" width="388" height="58" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="390" y="330" font-size="12" fill="#14532d" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">Usage{Input, CacheWrite, CacheRead, Output}</text>
  <text x="390" y="352" font-size="12" fill="#15803d" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">Prompt() = Input + CacheWrite + CacheRead</text>

  <!-- warning -->
  <rect x="24" y="384" width="732" height="66" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="42" y="406" font-size="12.5" fill="#92400e" font-weight="600">The cost of copying it wrong: prompt_tokens straight into Input</text>
  <text x="42" y="426" font-size="12" fill="#92400e">A 506-token prompt is reported as 698. The error is exactly the size of the hit.</text>
  <text x="42" y="444" font-size="12" fill="#92400e">On a cold start the error is 0 — it looks perfect in testing, and worsens as caching improves.</text>
</svg>
