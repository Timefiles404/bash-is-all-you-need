<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="760" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">Where a piece of context belongs in the prompt</text>
  <text x="736" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 05 · part 4</text>

  <text x="24" y="66" font-size="11.5" fill="#57606a">The test is not what it is, but how often it changes.</text>

  <rect x="24" y="76" width="712" height="96" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="96" font-size="12.5" fill="#1e3a8a" font-weight="600">system prompt — computed once at startup, byte-identical all session</text>

  <rect x="38" y="106" width="150" height="52" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="113" y="126" font-size="11.5" fill="#1e40af" text-anchor="middle">basePrompt</text>
  <text x="113" y="142" font-size="10.5" fill="#57606a" text-anchor="middle">one tool, no persistence</text>

  <rect x="196" y="106" width="150" height="52" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="271" y="122" font-size="11.5" fill="#1e40af" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">&lt;environment&gt;</text>
  <text x="271" y="138" font-size="10.5" fill="#57606a" text-anchor="middle">os / shell / cwd</text>
  <text x="271" y="152" font-size="10.5" fill="#57606a" text-anchor="middle">cd cannot move cwd</text>

  <rect x="354" y="106" width="180" height="52" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="444" y="122" font-size="11.5" fill="#1e40af" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">&lt;memory file="AGENTS.md"&gt;</text>
  <text x="444" y="138" font-size="10.5" fill="#57606a" text-anchor="middle">human-written: conventions</text>
  <text x="444" y="152" font-size="10.5" fill="#57606a" text-anchor="middle">the agent does not edit it</text>

  <rect x="542" y="106" width="180" height="52" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="632" y="122" font-size="11.5" fill="#1e40af" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">&lt;memory file="MEMORY.md"&gt;</text>
  <text x="632" y="138" font-size="10.5" fill="#57606a" text-anchor="middle">the agent, to its future self</text>
  <text x="632" y="152" font-size="10.5" fill="#57606a" text-anchor="middle">written now, read next session</text>

  <path d="M24 186 L736 186" stroke="#15803d" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="24" y="202" font-size="11.5" fill="#15803d" font-weight="600">cache breakpoint — everything above hits every call, and its tokens are paid exactly once</text>

  <text x="24" y="230" font-size="11.5" fill="#57606a">the message stream — append only. Volatile things freeze into the message that created them:</text>

  <rect x="24" y="240" width="712" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="38" y="258" font-size="11.5" fill="#1f2328" font-weight="600">turn 1 user</text>
  <rect x="120" y="246" width="330" height="44" rx="4" fill="#fff7ed" stroke="#d97706"/>
  <text x="132" y="263" font-size="10.5" fill="#92400e" font-family="ui-monospace, Consolas, monospace">&lt;now&gt;2026-08-27 04:38:53 +0800&lt;/now&gt;</text>
  <text x="132" y="279" font-size="9.5" fill="#92400e" font-family="ui-monospace, Consolas, monospace">&lt;git branch="main" dirty="3"&gt;Stage 04: the cache&lt;/git&gt;</text>
  <rect x="458" y="246" width="264" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="590" y="272" font-size="11.5" fill="#1f2328" text-anchor="middle">what you typed</text>

  <rect x="24" y="304" width="712" height="28" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="38" y="323" font-size="11.5" fill="#57606a">assistant / tool_result / assistant …  the rest of this turn, appended</text>

  <rect x="24" y="340" width="712" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="38" y="358" font-size="11.5" fill="#1f2328" font-weight="600">turn 2 user</text>
  <rect x="120" y="346" width="330" height="44" rx="4" fill="#fff7ed" stroke="#d97706"/>
  <text x="132" y="363" font-size="10.5" fill="#92400e" font-family="ui-monospace, Consolas, monospace">&lt;now&gt; the moment Enter was pressed &lt;/now&gt;</text>
  <text x="132" y="379" font-size="10.5" fill="#92400e" font-family="ui-monospace, Consolas, monospace">&lt;git branch="…" dirty="…"&gt;…&lt;/git&gt;</text>
  <rect x="458" y="346" width="264" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="590" y="372" font-size="11.5" fill="#1f2328" text-anchor="middle">the next thing you typed</text>

  <text x="24" y="422" font-size="11.5" fill="#d97706" font-weight="600">Two orange blocks, two different times — but two permanent lines: turn 1's is unchanged in turn 2's request.</text>

  <text x="24" y="452" font-size="11.5" fill="#57606a">The instinct is to recompute it per request so the model always knows the time. That is --break-cache: 3.4x.</text>
  <text x="24" y="472" font-size="11.5" fill="#57606a">A snapshot taken at Enter is accurate for the whole turn it belongs to: freshness and cache, both.</text>
  <text x="24" y="492" font-size="11.5" fill="#b91c1c">In one line: inject once and freeze; never recompute what is already in the prefix.</text>
</svg>
