<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 418" width="700" height="418"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="700" height="418" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="700" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="700" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">The same 401, two opposite decisions</text>
  <text x="676" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 09</text>

  <rect x="238" y="60" width="224" height="34" rx="6" fill="#fef2f2" stroke="#cf222e" stroke-width="1.5"/>
  <text x="350" y="82" font-size="13" fill="#cf222e" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">HTTP/1.1 401 Unauthorized</text>

  <text x="350" y="114" font-size="11.5" fill="#57606a" text-anchor="middle">The status code stops here. Look one field into the body:</text>
  <path d="M350 120 L350 138" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="252" y="140" width="196" height="32" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="161" font-size="12.5" fill="#92400e" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">error.type</text>

  <path d="M252 156 L150 156 L150 194" stroke="#cf222e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M448 156 L550 156 L550 194" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>

  <!-- left: AuthError -->
  <rect x="26" y="196" width="248" height="126" rx="6" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="150" y="218" font-size="13" fill="#cf222e" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">AuthError</text>
  <text x="42" y="240" font-size="11.5" fill="#57606a" font-family="ui-monospace, Consolas, monospace">"Invalid API key."</text>
  <text x="42" y="262" font-size="11.5" fill="#1f2328">The key is broken. Another endpoint</text>
  <text x="42" y="278" font-size="11.5" fill="#1f2328">uses the same key and fails too.</text>
  <rect x="42" y="288" width="90" height="24" rx="4" fill="#fef2f2" stroke="#cf222e"/>
  <text x="87" y="305" font-size="12" fill="#cf222e" text-anchor="middle" font-weight="600">stop</text>
  <text x="142" y="305" font-size="11.5" fill="#57606a">no call goes out</text>

  <!-- right: ModelError -->
  <rect x="426" y="196" width="248" height="126" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="550" y="218" font-size="13" fill="#15803d" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">ModelError</text>
  <text x="442" y="240" font-size="11.5" fill="#57606a" font-family="ui-monospace, Consolas, monospace">"Model ... is not supported"</text>
  <text x="442" y="262" font-size="11.5" fill="#1f2328">A model problem, not a key one.</text>
  <text x="442" y="278" font-size="11.5" fill="#1f2328">Another endpoint may have it.</text>
  <rect x="442" y="288" width="90" height="24" rx="4" fill="#f0fdf4" stroke="#15803d"/>
  <text x="487" y="305" font-size="12" fill="#15803d" text-anchor="middle" font-weight="600">fall back</text>
  <text x="542" y="305" font-size="11.5" fill="#57606a">the work finishes</text>

  <rect x="26" y="332" width="648" height="34" rx="6" fill="#fff7ed" stroke="#d97706"/>
  <text x="42" y="354" font-size="11.5" fill="#92400e">A nonexistent model returns 401, not 404, in the same envelope as a dead key. Both protocols do.</text>

  <text x="26" y="384" font-size="11.5" fill="#57606a">Write the general rule — 4xx is yours, stop — and both stop, though one could have finished.</text>
  <text x="26" y="402" font-size="11.5" fill="#57606a">That is why this table has to grow out of captured bytes.</text>
</svg>
