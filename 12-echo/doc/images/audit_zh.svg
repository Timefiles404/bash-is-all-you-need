<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="700" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="700" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">审计：重放已经发生过的命令</text>
  <text x="676" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 12</text>

  <rect x="26" y="62" width="200" height="118" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="126" y="82" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">十六段旧 trace</text>
  <text x="42" y="104" font-size="11" fill="#57606a" font-family="ui-monospace, Consolas, monospace">command_end  ls -la</text>
  <text x="42" y="120" font-size="11" fill="#57606a" font-family="ui-monospace, Consolas, monospace">command_end  cat go.mod</text>
  <text x="42" y="136" font-size="11" fill="#57606a" font-family="ui-monospace, Consolas, monospace">command_end  ls -la</text>
  <text x="42" y="152" font-size="11" fill="#57606a" font-family="ui-monospace, Consolas, monospace">command_end  go test ./...</text>
  <text x="42" y="170" font-size="11.5" fill="#1f2328">共 107 条，都带耗时</text>

  <path d="M226 121 L286 121" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="256" y="112" font-size="11" fill="#2563eb" text-anchor="middle">按原顺序</text>

  <rect x="288" y="84" width="180" height="74" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="378" y="106" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">一个冷缓存</text>
  <text x="378" y="126" font-size="11.5" fill="#1e40af" text-anchor="middle">只算 key、只查表</text>
  <text x="378" y="144" font-size="11.5" fill="#1e40af" text-anchor="middle">一条命令都不真跑</text>

  <path d="M468 121 L528 121" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="530" y="84" width="144" height="74" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="602" y="106" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">命中了几次</text>
  <text x="602" y="128" font-size="16" fill="#cf222e" text-anchor="middle" font-weight="600">4 / 107</text>
  <text x="602" y="148" font-size="11.5" fill="#57606a" text-anchor="middle">省下 401 ms</text>

  <!-- what it costs to find out -->
  <rect x="26" y="200" width="648" height="52" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="42" y="222" font-size="12.5" fill="#14532d" font-weight="600">这次审计花掉的东西：没有 API key，没有一次模型调用，没有一条命令真的执行</text>
  <text x="42" y="242" font-size="11.5" fill="#14532d">它读的是你已经付过钱的那些会话。所以「这个缓存对我的活值多少」，可以在动手写它之前回答。</text>

  <!-- the blind spot -->
  <rect x="26" y="268" width="648" height="72" rx="6" fill="#fef2f2" stroke="#cf222e" stroke-width="1.5"/>
  <text x="42" y="290" font-size="12.5" fill="#cf222e" font-weight="600">但这个工具看不见自己的成功</text>
  <text x="42" y="310" font-size="11.5" fill="#1f2328">拿一段「缓存开着」录下来的 trace 去审计，它报 0 次命中 —— 因为命中的那些命令根本没有产生 command_end。</text>
  <text x="42" y="328" font-size="11.5" fill="#1f2328">同一批活：关缓存那条臂 9/47，开缓存那条臂 0/44，而后者实际上真的供上了 12 次。</text>

  <text x="26" y="366" font-size="11.5" fill="#57606a">所以这个方法只能在「还没开缓存」的 trace 上用。它回答的是「值不值得开」，不是「开了之后效果如何」。</text>
  <text x="26" y="386" font-size="11.5" fill="#57606a">后一个问题要靠第 2 部分那个见证人机制，在运行时自己报。</text>
</svg>
