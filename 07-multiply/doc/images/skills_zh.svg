<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="760" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">两种放法：正文进提示，还是索引进提示</text>
  <text x="736" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 07</text>

  <text x="24" y="62" font-size="12.5" fill="#57606a" font-weight="600">三份都塞进系统提示</text>
  <text x="392" y="62" font-size="12.5" fill="#1e3a8a" font-weight="600">只把索引塞进系统提示</text>

  <!-- left: the bodies live in the prefix -->
  <rect x="24" y="72" width="344" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="38" y="92" font-size="11.5" fill="#57606a">系统提示（缓存前缀）</text>

  <rect x="38" y="100" width="316" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="196" y="125" font-size="11.5" fill="#1f2328" text-anchor="middle">mutation-test 的正文</text>

  <rect x="38" y="146" width="316" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="196" y="171" font-size="11.5" fill="#1f2328" text-anchor="middle">new-stage 的正文</text>

  <rect x="38" y="192" width="316" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="196" y="217" font-size="11.5" fill="#1f2328" text-anchor="middle">wire-probe 的正文</text>

  <rect x="24" y="256" width="104" height="30" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="275" font-size="10.5" fill="#57606a" text-anchor="middle">请求 1 · 6.1 kB</text>
  <rect x="136" y="256" width="104" height="30" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="188" y="275" font-size="10.5" fill="#57606a" text-anchor="middle">请求 2 · 6.1 kB</text>
  <rect x="248" y="256" width="104" height="30" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="300" y="275" font-size="10.5" fill="#57606a" text-anchor="middle">请求 N · 6.1 kB</text>

  <text x="24" y="306" font-size="11.5" fill="#57606a">跟技能毫无关系的那些请求，一样付这个钱。</text>

  <rect x="24" y="320" width="344" height="42" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="196" y="338" font-size="11.5" fill="#57606a" text-anchor="middle">没有「这一轮才进来」这一档</text>
  <text x="196" y="355" font-size="11" fill="#57606a" text-anchor="middle">进了前缀，就是每一轮都在</text>

  <!-- right: only the index lives in the prefix -->
  <rect x="392" y="72" width="344" height="88" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="406" y="92" font-size="11.5" fill="#1e40af">系统提示（缓存前缀）</text>
  <text x="406" y="112" font-size="10.5" fill="#1e3a8a" font-family="ui-monospace, Consolas, monospace">skills/mutation-test/SKILL.md · 一句话</text>
  <text x="406" y="130" font-size="10.5" fill="#1e3a8a" font-family="ui-monospace, Consolas, monospace">skills/new-stage/SKILL.md · 一句话</text>
  <text x="406" y="148" font-size="10.5" fill="#1e3a8a" font-family="ui-monospace, Consolas, monospace">skills/wire-probe/SKILL.md · 一句话</text>

  <rect x="392" y="172" width="104" height="30" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="444" y="191" font-size="10.5" fill="#1e40af" text-anchor="middle">请求 1 · 738 B</text>
  <rect x="504" y="172" width="104" height="30" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="556" y="191" font-size="10.5" fill="#1e40af" text-anchor="middle">请求 2 · 738 B</text>
  <rect x="616" y="172" width="104" height="30" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="668" y="191" font-size="10.5" fill="#1e40af" text-anchor="middle">请求 N · 738 B</text>

  <rect x="392" y="210" width="344" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="406" y="228" font-size="11.5" fill="#57606a">磁盘上，一共 6.1 kB，一次都不进前缀</text>
  <text x="406" y="248" font-size="10.5" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">skills/mutation-test/SKILL.md</text>
  <text x="406" y="264" font-size="10.5" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">skills/new-stage/SKILL.md</text>
  <text x="406" y="280" font-size="10.5" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">skills/wire-probe/SKILL.md</text>

  <path d="M500 290 L500 314" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="512" y="306" font-size="11" fill="#15803d">cat：只在用得上那一轮</text>

  <rect x="392" y="320" width="344" height="42" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="564" y="338" font-size="11.5" fill="#14532d" text-anchor="middle" font-weight="600">这一轮的对话（缓存断点之后）</text>
  <text x="564" y="355" font-size="11" fill="#14532d" text-anchor="middle">一份正文，只有那一份</text>

  <text x="24" y="404" font-size="11.5" fill="#57606a">索引不是免费的：738 B 坐在每一次请求的前缀里，一整个会话一次不少。它只是比 6.1 kB 便宜。</text>
  <text x="24" y="424" font-size="11.5" fill="#57606a">正文进的是对话，不是前缀 —— 所以它只在被读过的那一轮之后，才开始占地方。</text>
</svg>
