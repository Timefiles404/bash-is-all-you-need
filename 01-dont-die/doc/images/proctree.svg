<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="700" height="380" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="700" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="700" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">Killing the shell, and killing the tree</text>
  <text x="676" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 01</text>

  <line x1="350" y1="56" x2="350" y2="316" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ============ panel A: kill only the shell ============ -->
  <rect x="24" y="56" width="290" height="26" rx="5" fill="#f3f4f6" stroke="#d0d7de"/>
  <text x="169" y="74" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">cmd.Process.Kill()</text>

  <rect x="94" y="94" width="150" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="169" y="113" font-size="12.5" fill="#1f2328" text-anchor="middle">agent</text>
  <path d="M169 122 L169 150" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M28 174 L92 174" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="28" y="166" font-size="11" fill="#2563eb">kill</text>
  <rect x="94" y="152" width="150" height="32" rx="6" fill="#f3f4f6" stroke="#d0d7de"/>
  <text x="169" y="166" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">bash -c</text>
  <text x="169" y="180" font-size="11" fill="#6b7280" text-anchor="middle">dead</text>

  <path d="M169 184 L169 196 L107 196 L107 208" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M169 184 L169 196 L231 196 L231 208" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="55" y="210" width="104" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="107" y="224" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">sleep 300</text>
  <text x="107" y="238" font-size="11" fill="#1e40af" text-anchor="middle">still running</text>

  <rect x="179" y="210" width="104" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="231" y="224" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">sleep 300</text>
  <text x="231" y="238" font-size="11" fill="#1e40af" text-anchor="middle">still running</text>

  <rect x="42" y="258" width="254" height="46" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="169" y="277" font-size="12" fill="#7f1d1d" text-anchor="middle">two orphans, re-parented to init</text>
  <text x="169" y="295" font-size="12" fill="#7f1d1d" text-anchor="middle">pipe still open, Wait() still blocked</text>

  <!-- ============ panel B: kill the container ============ -->
  <rect x="386" y="56" width="290" height="26" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="531" y="74" font-size="12.5" fill="#1e3a8a" text-anchor="middle">one kill, aimed at the container</text>

  <rect x="456" y="94" width="150" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="531" y="113" font-size="12.5" fill="#1f2328" text-anchor="middle">agent</text>
  <path d="M531 122 L531 150" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="392" y="142" width="278" height="110" rx="8" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="392" y="136" font-size="11.5" fill="#2563eb">process group / job object</text>

  <path d="M676 174 L664 174" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="676" y="166" font-size="11" fill="#2563eb" text-anchor="end">kill</text>

  <rect x="456" y="152" width="150" height="32" rx="6" fill="#f3f4f6" stroke="#d0d7de"/>
  <text x="531" y="166" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">bash -c</text>
  <text x="531" y="180" font-size="11" fill="#6b7280" text-anchor="middle">dead</text>

  <path d="M531 184 L531 196 L469 196 L469 208" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M531 184 L531 196 L593 196 L593 208" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="417" y="210" width="104" height="32" rx="6" fill="#f3f4f6" stroke="#d0d7de"/>
  <text x="469" y="224" font-size="11.5" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">sleep 300</text>
  <text x="469" y="238" font-size="11" fill="#6b7280" text-anchor="middle">dead</text>

  <rect x="541" y="210" width="104" height="32" rx="6" fill="#f3f4f6" stroke="#d0d7de"/>
  <text x="593" y="224" font-size="11.5" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">sleep 300</text>
  <text x="593" y="238" font-size="11" fill="#6b7280" text-anchor="middle">dead</text>

  <rect x="404" y="258" width="254" height="46" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="531" y="277" font-size="12" fill="#14532d" text-anchor="middle">all three exit together</text>
  <text x="531" y="295" font-size="12" fill="#14532d" text-anchor="middle">every writer closed, Wait() returns</text>

  <text x="24" y="336" font-size="11.5" fill="#57606a">Unix: Setpgid before Start(), then kill(-pgid, SIGKILL). Windows: AssignProcessToJobObject after</text>
  <text x="24" y="356" font-size="11.5" fill="#57606a">Start(), then TerminateJobObject. Neither walks the tree: walking is racy, it forks mid-enumeration.</text>
</svg>
