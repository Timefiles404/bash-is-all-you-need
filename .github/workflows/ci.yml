# The checks that have to pass before anything lands.
#
# The interesting job is `drift`, and it is the reason this file exists. The
# browser course under external/web builds every level by extracting real lines
# out of the stage directories, and it refuses to build when a byte has moved.
# Without that running automatically, a course about a codebase decays the
# ordinary way: the code changes, the lesson does not, and nobody finds out
# until a reader does.
#
# It needs no Go toolchain and takes seconds, so it runs on everything.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    name: the lessons still match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The chapters quote the stage code. A quote that no longer matches is a
      # lesson teaching something the repo does not do any more, and nothing
      # else in this file would notice.
      - name: chapters quote real code
        run: python external/tools/quotecheck.py
      - name: browser levels match the stages
        run: python external/web/tools/build.py --check

  go:
    name: go ${{ matrix.what }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        what: [test, vet, gofmt, race]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        if: matrix.what == 'gofmt'
        # -l lists what it would change. Anything listed is a failure, and the
        # listing is the error message.
        run: |
          out=$(gofmt -l ./*/code/ external/tui/)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet
        if: matrix.what == 'vet'
        run: go vet ./...
      - name: test
        if: matrix.what == 'test'
        run: go test ./... -count=1
      - name: race
        if: matrix.what == 'race'
        # Only the packages with concurrency worth the runtime cost: the shell,
        # and the two stages that made the agent tree concurrent.
        run: go test ./external/tui/... ./07-multiply/code/ ./08-sandbox/code/ -race -count=1

  crossbuild:
    name: every stage builds for ${{ matrix.goos }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The platform files are the easiest thing in this repo to break without
      # noticing, because the one you are on keeps compiling.
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          for d in ./[0-9][0-9]-*/code/; do
            go build -o /dev/null "$d" || exit 1
          done
          go build -o /dev/null ./external/tui/...
