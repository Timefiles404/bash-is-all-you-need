<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="760" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">Three command results, two shapes</text>
  <text x="736" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 03</text>

  <!-- neutral -->
  <rect x="230" y="62" width="300" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="82" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">neutral: one Msg, Role is user</text>
  <text x="380" y="102" font-size="11.5" fill="#1e40af" text-anchor="middle">carrying three BlockToolResult blocks</text>

  <path d="M300 120 L300 138 L170 138 L170 158" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <path d="M460 120 L460 138 L570 138 L570 158" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>

  <text x="170" y="176" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">OpenAI: three messages</text>
  <text x="570" y="176" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">Anthropic: one message, three blocks</text>

  <!-- left: three messages -->
  <rect x="40" y="188" width="260" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="52" y="209" font-size="10.5" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">{"role":"tool","tool_call_id":"call_1",…}</text>

  <rect x="40" y="228" width="260" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="52" y="249" font-size="10.5" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">{"role":"tool","tool_call_id":"call_2",…}</text>

  <rect x="40" y="268" width="260" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="52" y="289" font-size="10.5" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">{"role":"tool","tool_call_id":"call_3",…}</text>

  <text x="40" y="326" font-size="11.5" fill="#57606a">Each result is its own message, claimed by id.</text>

  <!-- right: one message with three blocks -->
  <rect x="440" y="188" width="280" height="114" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="452" y="206" font-size="10.5" fill="#57606a" font-family="ui-monospace, Consolas, monospace">{"role":"user","content":[</text>

  <rect x="460" y="212" width="246" height="26" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="470" y="229" font-size="10" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">{"type":"tool_result","tool_use_id":"toolu_1"}</text>

  <rect x="460" y="242" width="246" height="26" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="470" y="259" font-size="10" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">{"type":"tool_result","tool_use_id":"toolu_2"}</text>

  <rect x="460" y="272" width="246" height="26" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="470" y="289" font-size="10" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">{"type":"tool_result","tool_use_id":"toolu_3"}</text>

  <text x="440" y="326" font-size="11.5" fill="#57606a">All three in one user message, and first.</text>

  <!-- bottom -->
  <rect x="24" y="344" width="712" height="70" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="42" y="368" font-size="12.5" fill="#92400e" font-weight="600">Picking either shape as the neutral one smuggles a vendor's design into the core</text>
  <text x="42" y="390" font-size="12" fill="#92400e">So the neutral form has no tool role at all: a tool result is a block,</text>
  <text x="42" y="408" font-size="12" fill="#92400e">and which shape of message ends up carrying it is the adapter's decision.</text>
</svg>
