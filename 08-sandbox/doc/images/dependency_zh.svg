<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 558" width="780" height="558"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="780" height="558" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="780" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="780" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">go.mod 的版本下限走过的路</text>
  <text x="756" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 08</text>

  <text x="24" y="80" font-size="11.5" fill="#57606a">一次 go get，四步善后</text>
  <text x="604" y="64" font-size="11.5" fill="#57606a" text-anchor="middle">这个模块的语言版本下限</text>

  <text x="520" y="84" font-size="11" fill="#57606a" text-anchor="middle"
        font-family="ui-monospace, Consolas, monospace">go 1.23.0</text>
  <text x="604" y="84" font-size="11" fill="#57606a" text-anchor="middle"
        font-family="ui-monospace, Consolas, monospace">go 1.24.0</text>
  <text x="688" y="84" font-size="11" fill="#57606a" text-anchor="middle"
        font-family="ui-monospace, Consolas, monospace">go 1.25.0</text>

  <path d="M520 92 L520 436" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M604 92 L604 436" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M688 92 L688 436" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- R0 the starting floor -->
  <rect x="24" y="100" width="446" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="122" font-size="12" fill="#1f2328">出发点：go.mod 写着 go 1.24.0，README 对读者的承诺是 Go 1.24+</text>

  <!-- R1 raised, by a direct dependency -->
  <rect x="24" y="146" width="446" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="168" font-size="12.5" fill="#1f2328" font-weight="600">第 1 步　<tspan
        font-family="ui-monospace, Consolas, monospace" font-size="11.5">go get mvdan.cc/sh/v3@v3.13.1</tspan></text>
  <text x="40" y="188" font-size="11.5" fill="#57606a">它自己的 go.mod 声明 go 1.25.0 —— README 那句承诺当场作废</text>

  <!-- R2 pinned back -->
  <rect x="24" y="210" width="446" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="232" font-size="12.5" fill="#1f2328" font-weight="600">第 2 步　<tspan
        font-family="ui-monospace, Consolas, monospace" font-size="11.5">go get mvdan.cc/sh/v3@v3.12.0</tspan></text>
  <text x="40" y="252" font-size="11.5" fill="#57606a">它声明 go 1.23.0，低于下限，下限不动 —— 这一章要的功能一个都没少</text>

  <!-- R3 raised again, by a package nobody chose -->
  <rect x="24" y="274" width="446" height="88" rx="6" fill="#fef2f2" stroke="#cf222e" stroke-width="1.5"/>
  <text x="40" y="296" font-size="12.5" fill="#7f1d1d" font-weight="600">第 3 步　<tspan
        font-family="ui-monospace, Consolas, monospace" font-size="11.5">go get golang.org/x/term</tspan></text>
  <text x="40" y="314" font-size="11.5" fill="#991b1b">你没输入过这个包名 —— interp 自己 import 了它</text>
  <text x="40" y="333" font-size="10.5" fill="#cf222e"
        font-family="ui-monospace, Consolas, monospace">→ upgraded golang.org/x/sys</text>
  <text x="248" y="333" font-size="10.5" fill="#cf222e"
        font-family="ui-monospace, Consolas, monospace">v0.41.0 → v0.47.0</text>
  <text x="40" y="351" font-size="10.5" fill="#cf222e"
        font-family="ui-monospace, Consolas, monospace">→ bumped this module</text>
  <text x="248" y="351" font-size="10.5" fill="#cf222e"
        font-family="ui-monospace, Consolas, monospace">go 1.24.0 → go 1.25.0</text>

  <!-- R4 both pinned -->
  <rect x="24" y="374" width="446" height="52" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="40" y="396" font-size="12.5" fill="#14532d" font-weight="600">第 4 步　两个都钉住，下限回到 go 1.24.0</text>
  <text x="40" y="416" font-size="11.5" fill="#166534"><tspan
        font-family="ui-monospace, Consolas, monospace">x/term@v0.33.0</tspan> 声明 go 1.23.0；<tspan
        font-family="ui-monospace, Consolas, monospace">x/sys</tspan> 回到 <tspan
        font-family="ui-monospace, Consolas, monospace">v0.41.0</tspan></text>

  <!-- the floor, and what each step declared -->
  <circle cx="604" cy="117" r="4.5" fill="#15803d"/>

  <path d="M604 126 L604 146 L688 146 L688 158" stroke="#cf222e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="646" y="134" font-size="11" fill="#cf222e" text-anchor="middle">直接依赖</text>
  <circle cx="688" cy="172" r="9" fill="none" stroke="#cf222e" stroke-width="1.5"/>
  <circle cx="688" cy="172" r="4.5" fill="#cf222e"/>

  <path d="M688 186 L688 206 L604 206 L604 226" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <text x="646" y="194" font-size="11" fill="#15803d" text-anchor="middle">钉住</text>
  <circle cx="520" cy="236" r="9" fill="none" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="604" cy="236" r="4.5" fill="#15803d"/>

  <path d="M604 245 L604 285 L688 285 L688 305" stroke="#cf222e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="646" y="273" font-size="11" fill="#cf222e" text-anchor="middle">传递依赖</text>
  <circle cx="688" cy="318" r="9" fill="none" stroke="#cf222e" stroke-width="1.5"/>
  <circle cx="688" cy="318" r="4.5" fill="#cf222e"/>

  <path d="M688 332 L688 368 L604 368 L604 388" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <text x="646" y="356" font-size="11" fill="#15803d" text-anchor="middle">钉住</text>
  <circle cx="520" cy="400" r="9" fill="none" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="604" cy="400" r="4.5" fill="#15803d"/>

  <rect x="24" y="444" width="732" height="52" rx="6" fill="#fef2f2" stroke="#cf222e" stroke-width="1.5"/>
  <text x="40" y="468" font-size="12.5" fill="#cf222e" font-weight="600">同一个下限，被两个不同的原因抬高了两次 —— 一次是直接依赖，一次是没有人选过的传递依赖</text>
  <text x="40" y="488" font-size="12" fill="#991b1b">两次都没有任何输出提示你。要看到它只有一个办法：go get 之后打开 go.mod 读一遍。</text>

  <text x="24" y="518" font-size="11.5" fill="#57606a">○ 是这一步装进来的模块声明的语言版本，● 是你这个模块的下限 —— 下限永远跟着最高的那一个走。</text>
  <text x="24" y="538" font-size="11.5" fill="#57606a">四步之后 go.mod 里三行 require，两个版本是钉住的，而钉住的理由不在代码里的任何地方。</text>
</svg>
