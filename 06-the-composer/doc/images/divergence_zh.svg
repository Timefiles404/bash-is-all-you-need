<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="700" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="700" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">压缩之前和之后，两个计数的关系</text>
  <text x="676" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 06</text>

  <!-- axes -->
  <path d="M100 290 L548 290" stroke="#57606a" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M100 290 L100 86" stroke="#57606a" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="84" y="196" font-size="11.5" fill="#57606a" text-anchor="middle" transform="rotate(-90 84 196)">两个计数</text>

  <!-- compaction marker -->
  <path d="M320 98 L320 290" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="90" font-size="12" fill="#92400e" text-anchor="middle" font-weight="600">这里压缩了一次</text>

  <!-- events: keeps climbing -->
  <path d="M100 282 L320 180 L540 96" stroke="#2563eb" stroke-width="2.2" fill="none"/>
  <circle cx="320" cy="180" r="3.4" fill="#2563eb"/>
  <text x="552" y="94" font-size="12" fill="#2563eb">events happened so far</text>
  <text x="552" y="110" font-size="11" fill="#2563eb">发生过的事，只增不减</text>

  <!-- messages: drops back -->
  <path d="M100 282 L320 186" stroke="#15803d" stroke-width="2.2" fill="none"/>
  <path d="M320 186 L320 256" stroke="#15803d" stroke-width="2.2" stroke-dasharray="4 3"/>
  <path d="M320 256 L540 206" stroke="#15803d" stroke-width="2.2" fill="none"/>
  <circle cx="320" cy="256" r="3.4" fill="#15803d"/>
  <text x="552" y="204" font-size="12" fill="#15803d">the model can see</text>
  <text x="552" y="220" font-size="11" fill="#15803d">它现在还看得见几条</text>

  <!-- the gap -->
  <path d="M480 119 L480 220" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="470" y="172" font-size="11.5" fill="#cf222e" text-anchor="end">这道缝</text>
  <text x="470" y="188" font-size="11.5" fill="#cf222e" text-anchor="end">再也合不上了</text>

  <text x="112" y="312" font-size="11.5" fill="#57606a">压缩之前，两条线是贴在一起的</text>
  <text x="540" y="312" font-size="11.5" fill="#57606a" text-anchor="end">一次调用，又一次调用 →</text>

  <rect x="26" y="330" width="648" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="42" y="351" font-size="11.5" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">142 events happened so far · the model can see 9 messages · 2 cache marks · tools: bash</text>

  <text x="26" y="384" font-size="11.5" fill="#57606a">一个突然开始犯傻的 agent，通常就是右边那个数里已经没有你正在问的那件东西。聊天记录只有左边那个数。</text>
</svg>
