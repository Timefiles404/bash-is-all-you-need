<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="760" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">看门狗只做一件事：拿现在减去「最后一个字节的时刻」</text>
  <text x="736" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 10</text>

  <!-- reader lane -->
  <text x="24" y="92" font-size="12.5" fill="#1f2328" font-weight="600">读者</text>
  <text x="24" y="110" font-size="11.5" fill="#57606a">每次读到</text>
  <text x="24" y="126" font-size="11.5" fill="#57606a">字节就写</text>
  <text x="24" y="142" font-size="11.5" fill="#57606a">一个时刻</text>
  <line x1="96" y1="112" x2="710" y2="112" stroke="#d0d7de" stroke-width="1.2"/>

  <g fill="#eff6ff" stroke="#2563eb" stroke-width="1.2">
    <rect x="100" y="100" width="22" height="22" rx="4"/>
    <rect x="134" y="100" width="22" height="22" rx="4"/>
    <rect x="168" y="100" width="22" height="22" rx="4"/>
  </g>
  <text x="196" y="94" font-size="12" fill="#1e40af">最后一个字节 —— last = 这一刻</text>
  <path d="M190 112 L179 112" stroke="#2563eb" stroke-width="1.2"/>
  <path d="M179 100 L179 148" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="330" y="118" font-size="12.5" fill="#92400e" font-weight="600">此后没有任何字节到达</text>

  <!-- watcher lane -->
  <text x="24" y="196" font-size="12.5" fill="#1f2328" font-weight="600">看门狗</text>
  <text x="24" y="214" font-size="11.5" fill="#57606a">每 idle/4</text>
  <text x="24" y="230" font-size="11.5" fill="#57606a">比一次</text>
  <line x1="96" y1="212" x2="710" y2="212" stroke="#d0d7de" stroke-width="1.2"/>

  <g font-size="11.5" fill="#57606a" text-anchor="middle">
    <circle cx="259" cy="212" r="6" fill="#ffffff" stroke="#57606a" stroke-width="1.4"/>
    <text x="259" y="240">0.25</text>
    <circle cx="339" cy="212" r="6" fill="#ffffff" stroke="#57606a" stroke-width="1.4"/>
    <text x="339" y="240">0.50</text>
    <circle cx="419" cy="212" r="6" fill="#ffffff" stroke="#57606a" stroke-width="1.4"/>
    <text x="419" y="240">0.75</text>
  </g>
  <text x="339" y="258" font-size="11.5" fill="#57606a" text-anchor="middle">差值还不到 idle，什么都不做</text>

  <circle cx="499" cy="212" r="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="499" y="240" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="600">1.00</text>

  <!-- the fire -->
  <path d="M499 220 L499 288" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="392" y="290" width="286" height="44" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="535" y="309" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="600">差值 &gt;= idle</text>
  <text x="535" y="327" font-size="12" fill="#92400e" text-anchor="middle">cancel(errStalled) —— 这次调用被判成挂死</text>

  <!-- detection band -->
  <rect x="499" y="152" width="100" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-dasharray="4 3"/>
  <text x="549" y="169" font-size="11.5" fill="#92400e" text-anchor="middle">idle → idle × 1.25</text>
  <text x="486" y="169" font-size="11.5" fill="#57606a">检测最晚迟一个 tick，绝不会早于 idle</text>

  <!-- why not reset -->
  <rect x="24" y="352" width="712" height="96" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="42" y="376" font-size="12.5" fill="#1f2328" font-weight="600">为什么不是「每读到字节就 timer.Reset(idle)」</text>
  <text x="42" y="398" font-size="12" fill="#57606a">定时器到期 → 运行时已经把它的回调排进队列 → 字节这时到了，Reset 晚了一微秒 → 调用被判成挂死，而字节明明来了。</text>
  <text x="42" y="418" font-size="12" fill="#57606a">这个窗口很窄，这正是它贵的地方：它偶尔响一次，看起来像 provider 不稳定，而不像自己的 bug。</text>
  <text x="42" y="438" font-size="12" fill="#1f2328">比较时间戳赢不掉也输不掉这场竞争：读者先写下时刻，看门狗后读它，已经到的字节一定被下一次比较看见。</text>
</svg>
