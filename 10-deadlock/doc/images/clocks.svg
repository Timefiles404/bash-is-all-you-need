<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="760" height="452" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="760" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">Three clocks, each watching one stretch of a call</text>
  <text x="736" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 10</text>

  <!-- the old single number -->
  <path d="M62 74 L62 88 L706 88 L706 74" stroke="#d97706" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <text x="384" y="68" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="600">the old single number: http.Client.Timeout covers all of it</text>

  <!-- spine -->
  <line x1="62" y1="140" x2="710" y2="140" stroke="#57606a" stroke-width="1.5"/>

  <rect x="62" y="122" width="92" height="36" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="108" y="145" font-size="12" fill="#1f2328" text-anchor="middle">DNS · dial</text>
  <rect x="154" y="122" width="56" height="36" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="182" y="145" font-size="12" fill="#1f2328" text-anchor="middle">TLS</text>
  <rect x="210" y="122" width="72" height="36" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="246" y="145" font-size="12" fill="#1f2328" text-anchor="middle">write req</text>
  <rect x="282" y="122" width="72" height="36" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="318" y="145" font-size="12" fill="#1f2328" text-anchor="middle">headers</text>

  <!-- bytes -->
  <g fill="#eff6ff" stroke="#2563eb" stroke-width="1.2">
    <rect x="378" y="128" width="24" height="24" rx="4"/>
    <rect x="414" y="128" width="24" height="24" rx="4"/>
    <rect x="450" y="128" width="24" height="24" rx="4"/>
    <rect x="576" y="128" width="24" height="24" rx="4"/>
    <rect x="612" y="128" width="24" height="24" rx="4"/>
  </g>
  <text x="426" y="112" font-size="12" fill="#1e40af" text-anchor="middle">bytes · bytes · bytes</text>
  <text x="606" y="112" font-size="12" fill="#1e40af" text-anchor="middle">bytes · bytes</text>
  <text x="513" y="145" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="600">a quiet stretch</text>

  <rect x="648" y="122" width="62" height="36" rx="5" fill="#f0fdf4" stroke="#15803d"/>
  <text x="679" y="145" font-size="12" fill="#14532d" text-anchor="middle">[DONE]</text>

  <!-- connect -->
  <path d="M62 186 L62 176 L282 176" stroke="#57606a" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
  <text x="172" y="200" font-size="11.5" fill="#57606a" text-anchor="middle">only the OS bounds this part</text>
  <path d="M284 176 L284 196 L352 196 L352 176" stroke="#57606a" stroke-width="1.8" fill="none"/>
  <text x="366" y="200" font-size="12.5" fill="#1f2328">connect (30s): headers must arrive within this</text>

  <!-- idle -->
  <path d="M476 226 L476 246 L574 246 L574 226" stroke="#2563eb" stroke-width="2" fill="none"/>
  <path d="M476 236 L574 236" stroke="#2563eb" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="470" y="240" font-size="12.5" fill="#1e40af" font-weight="600">idle (45s): the gap between two reads</text>
  <text x="470" y="258" font-size="11.5" fill="#1e40af">the only quantity on this timeline</text>
  <text x="470" y="274" font-size="11.5" fill="#1e40af">that separates slow from dead</text>

  <!-- total -->
  <path d="M62 276 L62 296 L710 296 L710 276" stroke="#57606a" stroke-width="1.8" fill="none"/>
  <text x="386" y="314" font-size="12.5" fill="#1f2328" text-anchor="middle">total (15m): a backstop on the whole call, per attempt</text>

  <!-- notes -->
  <rect x="62" y="336" width="648" height="88" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="80" y="360" font-size="12.5" fill="#1f2328">That dashed single number is being asked two unrelated questions:</text>
  <text x="96" y="382" font-size="12.5" fill="#57606a">How long may a healthy answer take?   Minutes, and unbounded in principle.</text>
  <text x="96" y="404" font-size="12.5" fill="#57606a">How long may a dead connection look alive?   Milliseconds. No reason to wait.</text>

  <text x="24" y="443" font-size="11.5" fill="#57606a">All three expire by cancelling one context. The error looks identical; only the cause knows which fired.</text>
</svg>
