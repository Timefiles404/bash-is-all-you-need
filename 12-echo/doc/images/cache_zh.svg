<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 486" width="700" height="486"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="700" height="486" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="700" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="700" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">一条命令在缓存里走的路</text>
  <text x="676" y="27" fill="#9ca3af" font-size="12" text-anchor="end">阶段 12</text>

  <rect x="238" y="58" width="224" height="30" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="78" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">cat wire-notes.md</text>
  <path d="M350 88 L350 104" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- gate 1: whitelist -->
  <rect x="212" y="106" width="276" height="34" rx="5" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="128" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="600">白名单：这条命令能进缓存吗</text>
  <path d="M488 123 L596 123" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="542" y="116" font-size="11" fill="#92400e" text-anchor="middle">看不懂</text>
  <path d="M350 140 L350 156" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- gate 2: key -->
  <rect x="212" y="158" width="276" height="52" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="178" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">键：什么算同一条命令</text>
  <text x="350" y="198" font-size="11" fill="#1e40af" text-anchor="middle">命令原文 + shell + 工作目录 + 输出上限 + 整个环境</text>
  <path d="M350 210 L350 226" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- lookup -->
  <rect x="252" y="228" width="196" height="30" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="248" font-size="12.5" fill="#1f2328" text-anchor="middle">表里有这个键吗</text>
  <path d="M448 243 L596 243" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="522" y="236" font-size="11" fill="#92400e" text-anchor="middle">没有</text>
  <path d="M350 258 L350 274" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- gate 3: witnesses -->
  <rect x="184" y="276" width="332" height="52" rx="5" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="296" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="600">见证人：它当时读过的东西变了吗</text>
  <text x="350" y="316" font-size="11" fill="#92400e" text-anchor="middle">命令行上点到的每一个路径，和当时的内容哈希</text>
  <path d="M516 302 L596 302 L596 258" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#ao)"/>
  <text x="558" y="296" font-size="11" fill="#92400e" text-anchor="middle">变了</text>
  <path d="M350 328 L350 348" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- hit -->
  <rect x="212" y="350" width="276" height="34" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="350" y="372" font-size="12.5" fill="#14532d" text-anchor="middle" font-weight="600">命中：把存下来的那段文本交回去</text>

  <!-- miss column -->
  <rect x="536" y="106" width="138" height="152" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="605" y="150" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">真的跑一遍</text>
  <text x="605" y="172" font-size="11" fill="#57606a" text-anchor="middle">起进程，读磁盘，</text>
  <text x="605" y="188" font-size="11" fill="#57606a" text-anchor="middle">渲染，截断</text>
  <text x="605" y="214" font-size="11" fill="#57606a" text-anchor="middle">也就是不开缓存时</text>
  <text x="605" y="230" font-size="11" fill="#57606a" text-anchor="middle">本来会发生的事</text>

  <rect x="26" y="400" width="648" height="36" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="42" y="422" font-size="11.5" fill="#1f2328">三道关的方向是同一个：<tspan font-weight="600">看不懂就拒绝。</tspan> 三个箭头都指向右边那一列，而那一列是「照常跑一遍」。</text>

  <text x="26" y="452" font-size="11.5" fill="#57606a">所以 echo.go 里绝大部分篇幅是拒绝规则，缓存本身大约 80 行。</text>
  <text x="26" y="470" font-size="11.5" fill="#57606a">拒绝过头只是白跑一次；漏放一条，就是把过时的答案一直给下去。</text>
</svg>
