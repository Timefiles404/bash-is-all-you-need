<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="780" height="44" fill="#1f2937" rx="8"/>
  <rect x="0" y="36" width="780" height="8" fill="#1f2937"/>
  <text x="24" y="28" fill="#ffffff" font-size="15" font-weight="600">What a command passes through before it runs</text>
  <text x="756" y="28" fill="#9ca3af" font-size="12" text-anchor="end">stage 08</text>

  <text x="40" y="62" font-size="11.5" fill="#57606a">the shell's own evaluation pipeline</text>
  <text x="452" y="62" font-size="11.5" fill="#57606a">what a policy standing here can see</text>

  <!-- P1 source text -->
  <rect x="40" y="70" width="376" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="56" y="90" font-size="12" fill="#57606a">source text</text>
  <text x="56" y="110" font-size="13" fill="#1f2328"
        font-family="ui-monospace, Consolas, monospace">X=.en; eval 'cat ${X}v'</text>
  <path d="M228 120 L228 140" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- O1 -->
  <path d="M416 95 L446 95" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="4 3" fill="none"/>
  <rect x="448" y="70" width="302" height="66" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="464" y="90" font-size="12.5" fill="#7f1d1d" font-weight="600">Level 1  a regexp over that text</text>
  <text x="464" y="109" font-size="12" fill="#991b1b">those four characters never appear</text>
  <text x="464" y="127" font-size="12" fill="#991b1b" font-weight="600">allowed</text>

  <!-- P2 words -->
  <rect x="40" y="142" width="376" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="56" y="162" font-size="12" fill="#57606a">words, quotes removed — as far as a parser gets</text>
  <text x="56" y="182" font-size="13" fill="#1f2328"
        font-family="ui-monospace, Consolas, monospace">eval  +  a single-quoted string</text>
  <path d="M228 192 L228 212" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- O2 -->
  <path d="M416 167 L446 167" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="4 3" fill="none"/>
  <rect x="448" y="142" width="302" height="84" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="464" y="162" font-size="12.5" fill="#7f1d1d" font-weight="600">Level 2  walk the tree, word by word</text>
  <text x="464" y="181" font-size="12" fill="#991b1b">a quoted string is data, not yet a program</text>
  <text x="464" y="199" font-size="12" fill="#991b1b">the two steps below have not happened</text>
  <text x="464" y="217" font-size="12" fill="#991b1b" font-weight="600">allowed (and it says so honestly)</text>

  <!-- P3 eval -->
  <rect x="40" y="214" width="376" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="234" font-size="12.5" fill="#1e3a8a" font-weight="600">eval: that string is now a program, parsed again</text>
  <text x="56" y="256" font-size="13" fill="#1e40af"
        font-family="ui-monospace, Consolas, monospace">cat ${X}v</text>
  <path d="M228 274 L228 294" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- P4 expansion -->
  <rect x="40" y="296" width="376" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="316" font-size="12.5" fill="#1e3a8a" font-weight="600">expansion: ${X} is .en, glued to the literal v</text>
  <text x="56" y="338" font-size="13" fill="#1e40af"
        font-family="ui-monospace, Consolas, monospace">.env</text>
  <path d="M228 356 L228 376" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- P5 argv -->
  <rect x="40" y="378" width="376" height="56" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="56" y="398" font-size="12.5" fill="#14532d" font-weight="600">the final argument vector — all syntax consumed</text>
  <text x="56" y="420" font-size="13" fill="#14532d"
        font-family="ui-monospace, Consolas, monospace">["cat", ".env"]</text>

  <!-- O3 -->
  <path d="M416 406 L446 406" stroke="#15803d" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>
  <rect x="448" y="378" width="302" height="66" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="464" y="398" font-size="12.5" fill="#14532d" font-weight="600">Level 3  look at argv[1:]</text>
  <text x="464" y="417" font-size="12" fill="#166534">the argument is .env; no other reading</text>
  <text x="464" y="435" font-size="12" fill="#166534" font-weight="600">blocked</text>

  <text x="40" y="470" font-size="11.5" fill="#57606a">One command, three vantage points. The later you stand, the less syntax is left and the more is certain.</text>
  <text x="40" y="492" font-size="11.5" fill="#57606a">The first two are not badly written: from where they stand, that value does not exist yet.</text>
</svg>
