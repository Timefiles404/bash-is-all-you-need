<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="780" height="44" fill="#1f2937" rx="8"/>
  <rect x="0" y="36" width="780" height="8" fill="#1f2937"/>
  <text x="24" y="28" fill="#ffffff" font-size="15" font-weight="600">一条命令在被执行之前经过了什么</text>
  <text x="756" y="28" fill="#9ca3af" font-size="12" text-anchor="end">阶段 08</text>

  <text x="40" y="62" font-size="11.5" fill="#57606a">shell 自己的求值流水线</text>
  <text x="452" y="62" font-size="11.5" fill="#57606a">策略站在这里的时候，它看得见什么</text>

  <!-- P1 source text -->
  <rect x="40" y="70" width="376" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="56" y="90" font-size="12" fill="#57606a">源文本</text>
  <text x="56" y="110" font-size="13" fill="#1f2328"
        font-family="ui-monospace, Consolas, monospace">X=.en; eval 'cat ${X}v'</text>
  <path d="M228 120 L228 140" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- O1 -->
  <path d="M416 95 L446 95" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="4 3" fill="none"/>
  <rect x="448" y="70" width="302" height="66" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="464" y="90" font-size="12.5" fill="#7f1d1d" font-weight="600">第 1 层　正则扫这段文本</text>
  <text x="464" y="109" font-size="12" fill="#991b1b">.env 这四个字符在文本里没有出现过</text>
  <text x="464" y="127" font-size="12" fill="#991b1b" font-weight="600">放行</text>

  <!-- P2 words -->
  <rect x="40" y="142" width="376" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="56" y="162" font-size="12" fill="#57606a">分词、去引号 —— 解析器能做到这里</text>
  <text x="56" y="182" font-size="13" fill="#1f2328"
        font-family="ui-monospace, Consolas, monospace">eval  +  一个单引号字符串</text>
  <path d="M228 192 L228 212" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- O2 -->
  <path d="M416 167 L446 167" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="4 3" fill="none"/>
  <rect x="448" y="142" width="302" height="84" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="464" y="162" font-size="12.5" fill="#7f1d1d" font-weight="600">第 2 层　走语法树，逐个词看</text>
  <text x="464" y="181" font-size="12" fill="#991b1b">单引号里的字符串是数据，还不是程序</text>
  <text x="464" y="199" font-size="12" fill="#991b1b">下面那两步此刻都还没发生</text>
  <text x="464" y="217" font-size="12" fill="#991b1b" font-weight="600">放行（如实报告：我算不出来）</text>

  <!-- P3 eval -->
  <rect x="40" y="214" width="376" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="234" font-size="12.5" fill="#1e3a8a" font-weight="600">eval：把那个字符串当程序，再解析一遍</text>
  <text x="56" y="256" font-size="13" fill="#1e40af"
        font-family="ui-monospace, Consolas, monospace">cat ${X}v</text>
  <path d="M228 274 L228 294" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- P4 expansion -->
  <rect x="40" y="296" width="376" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="316" font-size="12.5" fill="#1e3a8a" font-weight="600">参数展开：${X} 取到 .en，粘上字面量 v</text>
  <text x="56" y="338" font-size="13" fill="#1e40af"
        font-family="ui-monospace, Consolas, monospace">.env</text>
  <path d="M228 356 L228 376" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- P5 argv -->
  <rect x="40" y="378" width="376" height="56" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="56" y="398" font-size="12.5" fill="#14532d" font-weight="600">最终参数向量 —— 语法全部被消耗完了</text>
  <text x="56" y="420" font-size="13" fill="#14532d"
        font-family="ui-monospace, Consolas, monospace">["cat", ".env"]</text>

  <!-- O3 -->
  <path d="M416 406 L446 406" stroke="#15803d" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>
  <rect x="448" y="378" width="302" height="66" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="464" y="398" font-size="12.5" fill="#14532d" font-weight="600">第 3 层　看 argv[1:]</text>
  <text x="464" y="417" font-size="12" fill="#166534">参数就是 .env，没有别的读法</text>
  <text x="464" y="435" font-size="12" fill="#166534" font-weight="600">拦住</text>

  <text x="40" y="470" font-size="11.5" fill="#57606a">同一条命令，三个观察点。位置越靠后，剩下的语法越少，能确定的事越多。</text>
  <text x="40" y="492" font-size="11.5" fill="#57606a">前两层不是写得不够好：它们站的位置上，那个值还不存在。</text>
</svg>
