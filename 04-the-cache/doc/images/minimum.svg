<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="42" fill="#1f2937" rx="8"/>
  <rect x="0" y="34" width="760" height="8" fill="#1f2937"/>
  <text x="24" y="27" fill="#ffffff" font-size="15" font-weight="600">The first run with caching on, and nothing happened</text>
  <text x="736" y="27" fill="#9ca3af" font-size="12" text-anchor="end">stage 04</text>

  <text x="24" y="70" font-size="12.5" fill="#57606a">The markers are in the right place and the tests pass. Three requests, every cache counter zero.</text>

  <!-- axis -->
  <path d="M60 150 L700 150" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="700" y="170" font-size="11" fill="#57606a" text-anchor="end">prompt length (tokens)</text>

  <path d="M60 144 L60 156" stroke="#57606a" stroke-width="1"/>
  <text x="60" y="174" font-size="10.5" fill="#57606a" text-anchor="middle">0</text>

  <!-- threshold band -->
  <rect x="290" y="96" width="200" height="54" fill="#fff7ed" stroke="#d97706" stroke-dasharray="4 3"/>
  <text x="390" y="88" font-size="11.5" fill="#92400e" text-anchor="middle">minimum cacheable prefix</text>
  <text x="390" y="118" font-size="11.5" fill="#92400e" text-anchor="middle">1,024 – 4,096</text>
  <text x="390" y="136" font-size="10.5" fill="#92400e" text-anchor="middle">depends on the model</text>

  <!-- the three observed prompts -->
  <circle cx="123" cy="150" r="4" fill="#2563eb"/>
  <circle cx="141" cy="150" r="4" fill="#2563eb"/>
  <circle cx="153" cy="150" r="4" fill="#2563eb"/>
  <path d="M140 150 L140 200" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="140" y="218" font-size="11" fill="#2563eb" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">528 · 647 · 746</text>
  <text x="140" y="236" font-size="11" fill="#2563eb" text-anchor="middle">all three are left of it</text>

  <!-- what came back -->
  <rect x="330" y="196" width="400" height="88" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="346" y="218" font-size="11.5" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">HTTP 200</text>
  <text x="346" y="238" font-size="11.5" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">cache_creation_input_tokens: 0</text>
  <text x="346" y="258" font-size="11.5" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">cache_read_input_tokens: 0</text>
  <text x="346" y="277" font-size="11.5" fill="#92400e">no error, no warning, no field says it was ignored</text>

  <rect x="24" y="304" width="712" height="42" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="42" y="330" font-size="12.5" fill="#92400e">Below the threshold a marker is silently ignored, not rejected. Test it with a prompt big enough.</text>
</svg>
