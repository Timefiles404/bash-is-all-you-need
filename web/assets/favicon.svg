<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A shell prompt, which is the whole thesis of the repository. Drawn rather
       than downloaded so the tab icon is not a request that can fail, and drawn
       with the same 1.5-unit stroke as the interface icons so it reads as part
       of the same set. -->
  <rect width="32" height="32" rx="6" fill="#0b0d10"/>
  <path d="M9 11l5 5-5 5" fill="none" stroke="#6ee7b7" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17 21h7" fill="none" stroke="#5b6472" stroke-width="2.5"
        stroke-linecap="round"/>
</svg>
